# Pinned by uv.lock. `uv sync` builds .venv; `uv run pytest` runs the tests.
[project]
name = "mtah2027"
version = "0"
requires-python = "==3.11.*"
dependencies = [
    "numpy",
    "pandas",
    "lxml",
    "lightgbm>=4.7.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = ["pytest", "hypothesis"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
